<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>情報収集ツール | ぐるっとポン</title>
<style>
  /* ─ リセット & ベース ─ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    background: #f5f4f1;
    color: #1a1a1a;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ─ レイアウト ─ */
  .app { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ─ ヘッダー ─ */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    gap: 12px;
  }
  .header-left .eyebrow { font-size: 11px; color: #888; letter-spacing: .06em; margin-bottom: 2px; }
  .header-left .title   { font-size: 20px; font-weight: 500; color: #111; }

  /* ─ 収集ボタン ─ */
  .btn-collect {
    display: flex; align-items: center; gap: 6px;
    background: #1D9E75; color: #E1F5EE;
    border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background .15s; white-space: nowrap;
  }
  .btn-collect:hover:not(:disabled) { background: #0F6E56; }
  .btn-collect:disabled { background: #ccc; color: #fff; cursor: not-allowed; }
  .btn-collect .icon { font-size: 15px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinning { display: inline-block; animation: spin .8s linear infinite; }

  /* ─ ステータスバー ─ */
  .statusbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 16px;
    background: #fff; border: 0.5px solid #e0ddd8;
    border-radius: 8px; padding: 8px 14px;
    font-size: 12px; color: #777;
    margin-bottom: 14px;
  }
  .statusbar .progress { color: #1D9E75; font-weight: 500; margin-left: auto; }
  .statusbar .dot { color: #ccc; }

  /* ─ テーマフィルター ─ */
  .filters {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px;
  }
  .chip {
    font-size: 11px; padding: 4px 12px;
    border-radius: 99px;
    border: 0.5px solid #1D9E75;
    background: transparent; color: #1D9E75;
    cursor: pointer; transition: all .12s;
    white-space: nowrap;
  }
  .chip.active { background: #1D9E75; color: #E1F5EE; }
  .chip:hover:not(.active) { background: #E1F5EE; }

  /* ─ 件数 ─ */
  .result-count { font-size: 11px; color: #aaa; margin-bottom: 10px; }

  /* ─ グリッド（3列）─ */
  .grid-rows { display: flex; flex-direction: column; gap: 0; }
  .grid-row  { display: flex; gap: 10px; margin-bottom: 10px; }

  /* ─ カード ─ */
  .card {
    flex: 1; min-width: 0;
    background: #fff;
    border: 0.5px solid #e0ddd8;
    border-radius: 12px;
    padding: 12px;
    cursor: pointer;
    transition: border-color .15s;
    display: flex; flex-direction: column; gap: 7px;
  }
  .card:hover { border-color: #1D9E75; }
  .card.selected { border: 1.5px solid #1D9E75; }
  .card-ghost { flex: 1; min-width: 0; } /* 最終行の空きスロット埋め */

  .card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .badge {
    font-size: 10px; padding: 2px 7px;
    border-radius: 99px; flex-shrink: 0;
  }
  .badge-source-advertimes  { background: #E1F5EE; color: #085041; }
  .badge-source-markezine   { background: #E6F1FB; color: #0C447C; }
  .badge-source-digiday     { background: #FAEEDA; color: #633806; }
  .badge-source-itmedia     { background: #EAF3DE; color: #27500A; }
  .badge-source-default     { background: #f0ece8; color: #666; }
  .badge-theme { background: #f5f4f1; color: #666; }
  .badge-novelty { background: #FBEAF0; color: #72243E; }
  .card-date { font-size: 10px; color: #aaa; margin-left: auto; }

  .card-title {
    font-size: 12px; font-weight: 500;
    color: #111; line-height: 1.45;
  }
  .card-summary {
    font-size: 11px; color: #555; line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }
  .card-toggle {
    display: flex; align-items: center; gap: 3px;
    font-size: 10px; color: #1D9E75;
    margin-top: auto;
  }

  /* ─ 詳細パネル ─ */
  .detail {
    background: #fff;
    border: 0.5px solid #1D9E75;
    border-top: 2px solid #1D9E75;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 10px;
  }
  .detail-header {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 10px;
  }
  .detail-title { font-size: 14px; font-weight: 500; color: #111; line-height: 1.45; }
  .detail-close {
    background: none; border: none; cursor: pointer;
    color: #aaa; padding: 0; flex-shrink: 0; font-size: 18px; line-height: 1;
  }
  .detail-close:hover { color: #666; }
  .detail-summary { font-size: 12px; color: #555; line-height: 1.75; }
  .detail-link { font-size: 11px; color: #1D9E75; text-decoration: none; }
  .detail-link:hover { text-decoration: underline; }

  .section-label {
    font-size: 10px; font-weight: 500; color: #aaa;
    letter-spacing: .06em; margin-bottom: 5px;
  }
  .concept-block {
    font-size: 12px; color: #111; line-height: 1.75;
    padding: 9px 12px;
    background: #f9fdfb;
    border-left: 2px solid #1D9E75;
    border-radius: 0 8px 8px 0;
  }
  .hint-block {
    font-size: 12px; color: #085041; line-height: 1.75;
    padding: 9px 12px;
    background: #E1F5EE;
    border-radius: 8px;
  }
  .pitch-block {
    font-size: 12px; color: #633806; line-height: 1.75;
    padding: 9px 12px;
    background: #FAEEDA;
    border-radius: 8px;
  }
  .priority-tag {
    display: inline-block;
    font-size: 10px; font-weight: 500;
    color: #0C447C; background: #E6F1FB;
    padding: 3px 10px; border-radius: 99px;
  }

  /* ─ エラー / 空状態 ─ */
  .empty {
    text-align: center; padding: 60px 20px;
    color: #aaa; font-size: 13px; line-height: 1.8;
  }
  .empty .icon { font-size: 36px; margin-bottom: 12px; opacity: .4; }
  .error-msg {
    background: #fff5f5; border: 0.5px solid #fcc;
    border-radius: 8px; padding: 12px 16px;
    font-size: 12px; color: #c00; margin-bottom: 14px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-left">
      <div class="eyebrow">ぐるっとポン</div>
      <div class="title">情報収集ツール</div>
    </div>
    <button class="btn-collect" id="collectBtn" onclick="handleCollect()">
      <span class="icon" id="collectIcon">↻</span>
      <span id="collectLabel">今すぐ収集する</span>
    </button>
  </div>

  <!-- ステータスバー -->
  <div class="statusbar">
    <span>最終収集：<span id="lastRun">－</span></span>
    <span class="dot">·</span>
    <span><span id="articleCount">0</span> 件</span>
    <span class="dot">·</span>
    <span id="sourceList"><!-- JSで実際のRSS_SOURCESに同期して描画 --></span>
    <span class="progress" id="progressMsg" style="display:none;"></span>
  </div>

  <!-- エラー表示 -->
  <div class="error-msg" id="errorMsg" style="display:none;"></div>

  <!-- テーマフィルター -->
  <div class="filters" id="filters"></div>

  <!-- 件数 -->
  <div class="result-count" id="resultCount"></div>

  <!-- カードグリッド -->
  <div class="grid-rows" id="gridRows">
    <div class="empty">
      <div class="icon">📰</div>
      「今すぐ収集する」を押すと記事を取得します
    </div>
  </div>

</div>

<script>
// ─── 設定 ───────────────────────────────────────────────────────
// GitHub Pages の index.html をデプロイ後、WORKER_URL を自分の Cloudflare Worker URL に変更
const WORKER_URL = 'https://flat-wildflower-5902.k-tochizawa.workers.dev';

// ─── 実際のRSS構成（worker.js の RSS_SOURCES と必ず同期させる）─────
// 【2026/07 見直し】worker.js側のソース入れ替えに合わせて更新。
// ステータスバーの表示とバッジ色をここだけ直せば同期できるようにする。
const ACTIVE_SOURCES = ['AdverTimes', 'DIGIDAY Japan', 'MarkeZine', 'ITmedia マーケティング'];

// ─── テーマ定義 ──────────────────────────────────────────────────
const THEMES = [
  { id: 'all',          label: 'すべて' },
  { id: 'retail',       label: 'スーパー・小売' },
  { id: 'tieup',        label: 'タイアップ' },
  { id: 'ooh',          label: 'OOH・店頭' },
  { id: 'passive',      label: 'パッシブ層' },
  { id: 'loyalty',      label: 'ロイヤルティ' },
  { id: 'gamification', label: 'ゲーミフィケーション' },
  { id: 'campaign',     label: '人気キャンペーン' },
  { id: 'target',       label: '40〜60代動向' },
  { id: 'recycle',      label: 'リサイクル' },
  { id: 'points',       label: 'ポイント経済圏' },
];

// ─── ソースバッジのスタイルマップ ────────────────────────────────
function sourceBadgeClass(source) {
  if (source.includes('AdverTimes'))  return 'badge-source-advertimes';
  if (source.includes('MarkeZine'))   return 'badge-source-markezine';
  if (source.includes('DIGIDAY'))     return 'badge-source-digiday';
  if (source.includes('ITmedia'))     return 'badge-source-itmedia';
  return 'badge-source-default';
}

// ─── 状態 ───────────────────────────────────────────────────────
let articles   = [];
let activeTheme = 'all';
let selectedId  = null;
let loading     = false;

// ─── ステータスバーのソース表示（実配信構成と同期） ─────────────────
function renderSourceList() {
  document.getElementById('sourceList').textContent = ACTIVE_SOURCES.join(' · ');
}

// ─── テーマフィルター描画 ─────────────────────────────────────────
function renderFilters() {
  document.getElementById('filters').innerHTML = THEMES.map(t =>
    `<button class="chip${activeTheme === t.id ? ' active' : ''}" onclick="setTheme('${t.id}')">${t.label}</button>`
  ).join('');
}

function setTheme(id) {
  activeTheme = id;
  selectedId  = null;
  renderFilters();
  renderGrid();
}

// ─── カード選択 ──────────────────────────────────────────────────
function selectCard(id) {
  selectedId = (selectedId === id) ? null : id;
  renderGrid();
}

// ─── グリッド描画（3列・行ごとに詳細パネルを展開） ─────────────────
function renderGrid() {
  const filtered = activeTheme === 'all'
    ? articles
    : articles.filter(a => a.theme === activeTheme);

  document.getElementById('resultCount').textContent = filtered.length + ' 件';
  document.getElementById('articleCount').textContent = articles.length;

  if (!filtered.length) {
    document.getElementById('gridRows').innerHTML = `
      <div class="empty">
        <div class="icon">🔍</div>
        このテーマの記事は現在ありません
      </div>`;
    return;
  }

  let html = '';
  for (let i = 0; i < filtered.length; i += 3) {
    const row = filtered.slice(i, i + 3);
    let rowSelected = null;

    // ── 3枚のカード ──
    html += '<div class="grid-row">';
    for (const a of row) {
      const isSel = selectedId === a.id;
      if (isSel) rowSelected = a;
      html += `
        <div class="card${isSel ? ' selected' : ''}" onclick="selectCard('${a.id}')">
          <div class="card-meta">
            <span class="badge ${sourceBadgeClass(a.source)}">${a.source}</span>
            <span class="badge badge-theme">${a.themeLabel || ''}</span>
            ${a.novelty ? `<span class="badge badge-novelty">種${a.novelty}</span>` : ''}
            <span class="card-date">${a.date}</span>
          </div>
          <div class="card-title">${esc(a.title)}</div>
          <div class="card-summary">${esc(a.summary)}</div>
          <div class="card-toggle">
            <span>${isSel ? '▲' : '▼'}</span>
            <span>${isSel ? '閉じる' : '詳細を見る'}</span>
          </div>
        </div>`;
    }
    // 空きスロット（最終行が 3 未満の場合）
    for (let j = row.length; j < 3; j++) {
      html += '<div class="card-ghost"></div>';
    }
    html += '</div>';

    // ── 行に選択カードがあれば詳細パネルを展開 ──
    if (rowSelected) {
      const a = rowSelected;
      html += `
        <div class="detail">
          <div class="detail-header">
            <div class="detail-title">${esc(a.title)}</div>
            <button class="detail-close" onclick="selectCard('${a.id}')" aria-label="閉じる">×</button>
          </div>
          ${a.priorityFit ? `<div><span class="priority-tag">事業優先度：${esc(a.priorityFit)}</span></div>` : ''}
          <div class="detail-summary">${esc(a.summary)}</div>
          ${a.url ? `<a class="detail-link" href="${esc(a.url)}" target="_blank" rel="noopener">元記事を読む →</a>` : ''}
          <div>
            <div class="section-label">コンセプト抽出</div>
            <div class="concept-block">${esc(a.concept)}</div>
          </div>
          <div>
            <div class="section-label">ぐるっとポンへの企画ヒント</div>
            <div class="hint-block">${esc(a.hint)}</div>
          </div>
          ${a.supermarketPitch ? `
          <div>
            <div class="section-label">スーパー提案への接続</div>
            <div class="pitch-block">${esc(a.supermarketPitch)}</div>
          </div>` : ''}
        </div>`;
    }
  }

  document.getElementById('gridRows').innerHTML = html;
}

// ─── 収集実行 ────────────────────────────────────────────────────
// ─── ページ初期表示：KV から保存済み記事を読み込む ─────────────────
async function loadSaved() {
  const prog  = document.getElementById('progressMsg');
  const errEl = document.getElementById('errorMsg');
  prog.style.display  = 'inline';
  prog.textContent    = '保存済み記事を読み込み中…';

  try {
    const res  = await fetch(WORKER_URL);
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || `HTTP ${res.status}`);

    articles = data.articles || [];
    if (articles.length > 0) {
      document.getElementById('lastRun').textContent = '保存済み ' + articles.length + ' 件';
    }
    prog.style.display = 'none';
  } catch (err) {
    errEl.textContent = `読み込みに失敗しました：${err.message}`;
    errEl.style.display = 'block';
    prog.style.display  = 'none';
  }

  renderFilters();
  renderGrid();
}

// ─── 収集ボタン：新規記事を取得して KV に追記保存 ─────────────────
async function handleCollect() {
  if (loading) return;
  loading = true;

  const btn   = document.getElementById('collectBtn');
  const icon  = document.getElementById('collectIcon');
  const label = document.getElementById('collectLabel');
  const prog  = document.getElementById('progressMsg');
  const errEl = document.getElementById('errorMsg');

  btn.disabled = true;
  errEl.style.display = 'none';
  prog.style.display  = 'inline';

  const steps = [
    'RSSフィード取得中…',
    'D-1フィルター適用中…',
    '記事全文取得中…',
    'Claude APIで変換中…',
    'KVに保存中…',
  ];

  let stepIdx = 0;
  prog.textContent = steps[stepIdx];
  const ticker = setInterval(() => {
    stepIdx = Math.min(stepIdx + 1, steps.length - 1);
    prog.textContent = steps[stepIdx];
  }, 3500);

  icon.className   = 'icon spinning';
  icon.textContent = '↻';
  label.textContent = '収集中…';

  try {
    // ?collect=1 で新規収集 → KV保存 → 全件返却
    const res  = await fetch(WORKER_URL + '?collect=1');
    const data = await res.json();

    clearInterval(ticker);

    if (!res.ok || data.error) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    articles = data.articles || [];

    const now = new Date();
    document.getElementById('lastRun').textContent =
      now.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric' }) + ' ' +
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');

    const newCount = data.newCount || 0;
    prog.textContent = `${newCount} 件追加（累計 ${articles.length} 件）`;
    setTimeout(() => { prog.style.display = 'none'; }, 3000);

  } catch (err) {
    clearInterval(ticker);
    errEl.textContent = `収集に失敗しました：${err.message}`;
    errEl.style.display = 'block';
    prog.style.display  = 'none';
  }

  loading = false;
  btn.disabled     = false;
  icon.className   = 'icon';
  icon.textContent = '↻';
  label.textContent = '今すぐ収集する';

  renderFilters();
  renderGrid();
}

// ─── HTML エスケープ ─────────────────────────────────────────────
function esc(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── 初期化：ソース表示 → フィルター描画 → 保存済み記事を読み込む ────
renderSourceList();
renderFilters();
loadSaved();
</script>
</body>
</html>
